name: Required state contract
on: [push, pull_request]
permissions:
  contents: read
jobs:
  state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: UnofficialCrusaderPatch/UnofficialCrusaderPatch3
          ref: 02a7a6bc8ab956a91fc752e8c8ed215c149855e7
          path: framework
          sparse-checkout: content/ucp/code/extensions
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest lupa pyyaml
      - run: python -m pytest -q tests
        env:
          UCP_FRAMEWORK_PROXIES: framework/content/ucp/code/extensions/proxies.lua
